name: Node.js CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-lint-build:
    name: Test, Lint, and Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      
      NEXT_PUBLIC_BYPASS_CLERK: ${{ vars.NEXT_PUBLIC_BYPASS_CLERK }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      SUPABASE_BUCKET_APPROVED_IMAGES: ${{ vars.SUPABASE_BUCKET_APPROVED_IMAGES }}
      SUPABASE_BUCKET_PENDING_IMAGES: ${{ vars.SUPABASE_BUCKET_PENDING_IMAGES }}
      UPLOAD_RATE_LIMIT_MAX: ${{ vars.UPLOAD_RATE_LIMIT_MAX }}
      UPLOAD_RATE_LIMIT_WINDOW_MS: ${{ vars.UPLOAD_RATE_LIMIT_WINDOW_MS }}
      
      
      CLERK_SIGN_IN_URL: /signin
      CLERK_SIGN_UP_URL: /signup

    strategy:
      matrix:
        node-version: [20.x] # You can specify other versions or a matrix of versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Cache npm dependencies

      - name: Install dependencies
        run: npm ci # Use npm ci for cleaner installs in CI

      - name: Run linter
        run: npm run lint

      - name: Run tests and collect coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error # Fails the step if coverage/ directory is not found

      - name: Build project
        run: npm run build
